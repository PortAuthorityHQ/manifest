[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "manifest-sdk"
version = "0.1.0"
description = "Cryptographic receipts for AI agent tool calls"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["ai", "agent", "mcp", "audit", "cryptographic", "receipts", "compliance"]

[project.scripts]
manifest-py = "manifest_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/PortAuthorityHQ/manifest"
Repository = "https://github.com/PortAuthorityHQ/manifest"

[tool.maturin]
manifest-path = "../../manifest-py/Cargo.toml"
python-packages = ["manifest_sdk"]
module-name = "manifest_py"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
